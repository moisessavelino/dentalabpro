
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentaLab Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9;
        margin: 0;
        padding: 0;
      }
      * {
        transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease-out;
      }
      /* Padronização da cor da fonte ao digitar - PRETO ABSOLUTO */
      input, select, textarea, [contenteditable] {
        color: #000000 !important;
        font-weight: 500;
      }
      input::placeholder, textarea::placeholder {
        color: #94a3b8 !important; 
      }

      /* Estilos para Geração de PDF/Impressão */
      @media print {
        /* Ocultar elementos desnecessários no PDF */
        nav, 
        aside, 
        .fixed, 
        .print-hidden, 
        button, 
        header .flex,
        .bg-slate-50\/50.border-b,
        .sidebar,
        #sidebar { 
          display: none !important; 
        }

        /* Ajustar o container principal */
        main { 
          margin-left: 0 !important; 
          padding: 0 !important;
          width: 100% !important;
        }

        body {
          background-color: white !important;
        }

        .bg-white {
          box-shadow: none !important;
          border: none !important;
          border-radius: 0 !important;
        }

        /* Garantir que o extrato ocupe a página toda */
        .p-8, .p-10, .p-12 {
          padding: 0 !important;
        }

        /* Quebra de página inteligente */
        tr {
          page-break-inside: avoid;
        }

        /* Cores em escala de cinza de alta fidelidade para PDF */
        .text-blue-600, .text-cyan-600 { color: #0a3d62 !important; }
        .bg-emerald-100 { background-color: #f0fdf4 !important; }
        .bg-amber-100 { background-color: #fffbeb !important; }
        
        /* Forçar impressão de cores de fundo se configurado no browser */
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    </style>
